name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Fix Android and Recreate
        run: |
          # Ескі қате android папкасын толығымен жою
          rm -rf android
          
          # pubspec.yaml файлындағы пакет атын репозиторийден тәуелсіз ету
          sed -i 's/name: .*/name: games_hub_app/g' pubspec.yaml
          
          # Жаңа таза android платформасын жасау (дефис мәселесін айналып өту үшін --project-name қолданамыз)
          flutter create . --platforms=android --project-name=games_hub_app --org=com.mahjong.kazakh

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-kazakh-app
          path: build/app/outputs/flutter-apk/app-debug.apk
