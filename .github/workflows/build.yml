name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Recreate Clean Project
        run: |
          mkdir -p temp_app
          cp -r lib pubspec.yaml temp_app/ 2>/dev/null || true
          cd temp_app
          rm -rf android
          flutter create --org com.example --project-name bitecraft_ai --platforms android .
          
          # AndroidManifest.xml ішіне AdMob APPLICATION_ID қосу
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3613410984183490~3659453026"/>' "$MANIFEST_PATH"
          fi
          
          flutter pub get

      - name: Build APK
        run: |
          cd temp_app
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitecraft-ai-app
          path: temp_app/build/app/outputs/flutter-apk/app-debug.apk
