name: Build Android App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          mkdir temp_app
          flutter create --org com.gameshub temp_app
          cp pubspec.yaml temp_app/pubspec.yaml
          cp lib/main.dart temp_app/lib/main.dart
          cd temp_app
          flutter pub get

      - name: Build APK
        run: |
          cd temp_app
          flutter build apk --release

      - name: Build AAB
        run: |
          cd temp_app
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: temp_app/build/app/outputs/bundle/release/app-release.aab
