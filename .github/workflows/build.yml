name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v3
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          use-git: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Recreate Android Properly
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=games_hub_app

      - name: Build APK
        run: flutter build apk --debug --dart-define=GEMINI_API_KEY=AIzaSyAm44R-59SgK5k0J71XzE2v8Y3p0Q1w9Zx

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitecraft-ai-app
          path: build/app/outputs/flutter-apk/app-debug.apk
