name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Recreate Android Properly
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=games_hub_app

      - name: Add Internet Permission & AdMob ID
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # INTERNET рұқсатын қосу
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' $MANIFEST
          # AdMob App ID қосу
          sed -i '/<application/a \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3613410984183490~6007334630"/>' $MANIFEST

      - name: Build Release APK
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=AIzaSyAm44R-59SgK5k0J71XzE2v8Y3p0Q1w9Zx

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitecraft-ai-app
          path: build/app/outputs/flutter-apk/app-release.apk
